[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docguard"
version = "1.0.0"
description = "Rasmlar uchun ko'rinmas raqamli muhr (DCT-QIM) va Telegram boti"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "Pillow>=10.1", "aiogram>=3.4,<4", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["docguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
